name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Black
        run: black --check .

      - name: Mypy
        run: mypy src data

      - name: Pytest
        run: pytest -v

      # Informational only (continue-on-error): stays non-blocking so a new
      # CVE with no fix release yet (or a transitive advisory) can't fail CI
      # on its own. Pins are bumped deliberately, with behavior-equivalence
      # verification, when this scan finds something.
      - name: Dependency vulnerability scan
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt -r requirements-dev.txt
